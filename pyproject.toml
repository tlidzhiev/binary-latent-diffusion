[project]
name = "binary-latent-diffusion"
version = "0.1.0"
description = "Unofficial implementation of Binary Latent Diffusion"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "comet-ml==3.58.8",
    "datasets==5.1.0",
    "einops==0.8.2",
    "hydra-core==1.3.7",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "torchmetrics[image]==1.9.0",
    "torchvision==0.29.1",
    "tqdm==4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "jupyter==1.1.1",
    "pre-commit==4.7.0",
    "ruff==0.17.1",
    "ty==0.0.88",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["src"]

[tool.ruff.format]
quote-style = "single"

[[tool.ty.overrides]]
include = ["src/model/**", "src/loss/**", "src/metrics/**", "src/transforms/**"]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"
invalid-method-override = "ignore"

[tool.ruff]
line-length = 100
